# Configuration settings for Snakemake

# Directory prefix where the outputs will be saved to
# Rename this to your preferred naming convention with this format:year-month-day_Project_Name_SNPmake
prefix: 2026-08-19_CladeIV_clincal_h9h_validation_v2

# Relative path where your samples are found
samples: config/samples_clinical_cIV_validation_only.csv

# raw or trimmed
read_input_type: trimmed   # options: raw or trimmed
input_reads: temp_reads_dir_clinical/clade_IV/

# run mode
workflow_mode: full    # options: full, vcf-only

# Path to the reference genome
reference_genome: reference/telomere_mask_NoConcat_v3/Lojek_H9H_1/Lojek_H9H_1.fasta
reference_contig: Lojek_H9H_1

# Set the estimated genome size for coverage calculations 
genome_size: 12400000


# Command line parameters for rule trimmomatic_pe
adaptor_filepath: config/adapters/combined_Adaptors.fa
seed_mismatches: 2
palindrome_clipthreshold: 30
simple_clipthreshold: 10
minadapterlength: 8
keep_both_reads: true
#sliding window
window_size: 4
window_size_quality: 20
minlength: 40
headcrop_length: 0


# QC filters for bcftools filtering of SNPs
qual_snp_filter: 100
mq_snp_filter: 50
dp_snp_filter: 9
ad_snp_filter_alt_depth: 9
ad_snp_filter_ratio: 0.9

# QC filters for bcftools filtering of indels
qual_indel_filter: 100
mq_indel_filter: 50
dp_indel_filter: 9
ad_indel_filter_alt_depth: 9
ad_indel_filter_ratio: 0.9

# SNP fail percentage threshold
# variants that fail QC in at least this percentage of isolates will be excluded from all isolates
fail_threshold: 80.0

#snpEff
snpEff_path: 
data_dir: 
snpEff_config_file: 
snpeff_parameters: -d -no-downstream -no-upstream

# Window size for identifying SNPs near indels
indel_prox_window: 5

# Threshold for masking low coverage regions. Any site with coverage below this will be masked in the final consensus, and overlapping variants will be removed.
coverage_masking_threshold: 10


# If true, phage masking skipped
plasmid_variant_calling: true
phastest_results: 

# If you have an existing MSA that you want to use for phylogenetic tree construction, provide the path here. 
# Otherwise, leave blank and the workflow will generate an MSA from the filtered SNPs.
existing_msa:
